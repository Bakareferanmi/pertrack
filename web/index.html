<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PERTRACK</title>
<meta name="theme-color" content="#0B3B36">
<meta name="description" content="Class period reminders for teachers.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--sf:#fff;--bd:#E3E7EE;--ibd:#D5DAE3;--tx:#101828;--mu:#5B6475;--pr:#0B7A6B;--ac:#0B7A6B;--nb:#0B7A6B;--hero:#0B3B36;--heroBd:transparent;--selbg:#DDF3EF;--seltx:#0A4F46;--nav:#fff;--side:#0B3B36;--off:#E7EAF0;--ruby:#B0123A;--scarlet:#E8501F;--emerald:#0B9A5B;--science:#2F6FDE;--art:#7A4FD6;--sh:0 6px 16px rgba(11,59,54,.28);color-scheme:light}
:root[data-theme=dark]{--bg:#0B1416;--sf:#142226;--bd:#25363A;--ibd:#2C3F44;--tx:#E8F1EF;--mu:#9FB3AF;--ac:#5FD3BF;--nb:#2FB5A0;--hero:#0E4640;--heroBd:#1B5F56;--selbg:#123A35;--seltx:#8FE3D3;--nav:#101C1F;--side:#0A2623;--off:#1B2A2E;--ruby:#F0577F;--scarlet:#FF6B3D;--emerald:#2ED089;--science:#6FA2FF;--art:#A98BFF;--sh:0 6px 18px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--tx)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.disp{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;font-weight:700}
.mu{color:var(--mu)}.s{font-size:14px;font-weight:500}
.shell{display:flex;min-height:100vh}
#side{display:none}
main{flex:1;min-width:0;width:100%;max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 20px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--mu)}
.tab.on{color:var(--ac);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:26px;line-height:1.15}
.ib{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:50%}
.ib.sm{width:36px;height:36px}
.round{border:1px solid var(--bd);background:var(--sf);position:relative}
.dotn{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:#F5A524;border:2px solid var(--sf)}
.hero{background:var(--hero);border:1px solid var(--heroBd);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.hrow.end{align-items:flex-end}
.badge{background:#F5A524;color:#2B1B00;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.hs{font-size:13px;color:#BFE3DC}.hs2{font-size:15px;color:#CFEAE5}
.h2x{font-size:32px;line-height:1.05}
.cd{font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.rcs{display:flex;gap:10px}
.rc{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.rc b{display:flex;align-items:center;gap:6px;font-size:13px}.rc span{font-size:12px;color:#BFE3DC}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;border:0;font-weight:700;font-size:15px}
.pri{background:var(--pr);color:#fff}
.amb{background:#F5A524;color:#2B1B00}
.ghost{background:var(--sf);border:1px solid var(--ibd);color:var(--tx)}
.danger{background:transparent;border:1px solid #D92D20;color:#D92D20}
:root[data-theme=dark] .danger{color:#FF8A80;border-color:#FF8A80}
.big{width:100%;height:54px;border-radius:16px;font-size:16px}
.btn:disabled{background:var(--off);color:var(--mu);cursor:not-allowed;border:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 4px;gap:10px}
.sh h2{font-size:17px}
.prow{display:flex;gap:12px;align-items:center;margin-top:8px}
.time{width:46px;flex:0 0 46px;font-size:14px;font-weight:700}
.time small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.pc{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:4px 6px 4px 14px;min-height:58px}
.pc.done{color:var(--mu)}.pc.done b{color:var(--mu)}
.pc.next{background:var(--selbg);border:2px solid var(--nb);padding:3px 5px 3px 13px}
.pc.live{background:var(--hero);border:2px solid var(--nb);color:#fff;padding:3px 5px 3px 13px}
.pc.live small{color:#CFEAE5}
.pc-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0;display:block}
.pc-main b{display:block;font-size:15px}
.pc-main small{display:block;font-size:13px;color:var(--mu)}
.pc.next .pc-main b,.pc.next .pc-main small{color:var(--seltx)}
.tag{background:var(--pr);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.bellb{color:var(--ac)}.bellb.off{color:var(--mu)}.pc.live .bellb{color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mu)}
.ruby{background:var(--ruby)}.scarlet{background:var(--scarlet)}.emerald{background:var(--emerald)}.science{background:var(--science)}.art{background:var(--art)}
.empty{margin-top:12px;padding:18px;border:1px dashed var(--ibd);border-radius:16px;color:var(--mu);text-align:center;font-size:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:12px}
.card h3{font-size:15px;margin-bottom:2px}
.nudge{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--selbg);color:var(--seltx);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px}
.nudge .btn{height:40px;flex:0 0 auto}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}
.srow:last-child{border:0}.srow b{display:block;font-size:15px}.srow small{display:block;font-size:13px;color:var(--mu)}
.swb{width:56px;height:44px;flex:0 0 56px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.sw{width:52px;height:32px;border-radius:999px;background:var(--ibd);padding:3px;display:flex;justify-content:flex-start;align-items:center}
.sw.on{background:var(--pr);justify-content:flex-end}
.sw i{width:26px;height:26px;border-radius:50%;background:#fff;display:block}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--mu)}
.in{width:100%;height:50px;border:1px solid var(--ibd);border-radius:14px;background:var(--sf);padding:0 14px}
.in::placeholder{color:var(--mu);opacity:.7}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chs.eq{flex-wrap:nowrap;gap:6px}.chs.eq .ch{flex:1;min-width:0;padding:0}
.ch{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ibd);background:var(--sf);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ch.on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.ch.on2{background:var(--selbg);border:2px solid var(--nb);color:var(--seltx);font-weight:700}
.sub{display:inline-flex;align-items:center;height:44px;padding:0 0 0 14px;border-radius:12px;background:var(--sf);border:1px solid var(--ibd);font-weight:600;font-size:14px}
.addrow{display:flex;gap:8px}.addrow .in{height:48px;flex:1;min-width:0}.addrow .btn{height:48px}
.hint{font-size:12px;color:var(--mu)}
.row3{display:flex;gap:10px}.row3 .fld{flex:1;min-width:0;margin-top:14px}
.err{color:#D92D20;font-size:14px;font-weight:600;margin-top:10px}
:root[data-theme=dark] .err{color:#FF8A80}
.days{display:flex;gap:8px}.days .ch{flex:1;min-width:0;padding:0}
.dayrow{display:flex;gap:8px;margin-bottom:6px}
.dayb{flex:1;min-height:60px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dayb span{font-size:12px;color:var(--mu);font-weight:500}.dayb b{font-size:17px}
.dayb.today{border-color:var(--nb)}
.dayb.on{background:var(--pr);border-color:var(--pr);color:#fff}.dayb.on span{color:#CFEAE5}
.col{display:none}.col.on{display:block}.colh{display:none;font-size:14px;margin:4px 0}
.sbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));z-index:41;max-width:560px;margin:0 auto}
.shd{display:flex;align-items:center;justify-content:space-between}.shd h2{font-size:20px}
.sfoot{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.ob{max-width:520px;margin:0 auto;padding:max(36px,env(safe-area-inset-top)) 20px 28px;min-height:100vh;display:flex;flex-direction:column}
.ob .obt{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.ob h1{font-size:28px;line-height:1.15}
.appic{width:48px;height:48px;border-radius:13px;background:#0F4A43;display:flex;align-items:center;justify-content:center}
.prev{background:var(--selbg);color:var(--seltx);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:2px}
.obf{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;gap:10px}
.obf .hint{display:flex;align-items:center;gap:8px}
#banner{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;z-index:60;pointer-events:none}
.bn{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 12px 16px;border-radius:18px;color:#fff;background:#0E4640;border:1px solid #1B5F56;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bn.at{background:#F5A524;color:#2B1B00;border-color:#F5A524}
.bn b{display:block;font-size:16px}.bn span{font-size:14px;opacity:.92}
@media(min-width:900px){
.tabs{display:none}
#side{display:flex;flex-direction:column;gap:28px;width:250px;flex:0 0 250px;height:100vh;position:sticky;top:0;background:var(--side);color:#fff;padding:28px 18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-size:22px;letter-spacing:.02em}
.sn{display:flex;flex-direction:column;gap:4px}
.sl{min-height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:12px;border:0;background:none;color:#B9D6D1;font-size:15px;font-weight:500;text-align:left}
.sl.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.who{margin-top:auto;background:rgba(255,255,255,.09);border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px}
.who b{display:block;font-size:14px}.who small{font-size:12px;color:#B9D6D1}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:#F5A524;color:#2B1B00;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
main{max-width:1180px;padding:32px 36px 48px}
.top h1 br{display:none}.top h1{font-size:32px}
.tgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.tgrid .sh:first-child{margin-top:0}
.dayrow{display:none}
.cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}
.col{display:block}.colh{display:block}
.colh.today{color:var(--ac)}
.cols .prow{flex-direction:column;align-items:stretch;gap:4px}
.cols .pc{flex-wrap:wrap;padding-bottom:4px}
.cols .pc-main{flex:1 1 100%}
.cols .tag{margin-left:auto}
.cols .time{width:auto;flex:none;display:flex;gap:6px;font-size:13px}.cols .time small{display:inline}
.cols .time small::before{content:'– '}
.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px;max-width:520px}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="banner" aria-live="assertive"></div>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const KEY='pertrack:v1';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TITLES=['Mr.','Mrs.','Miss','Ms.','Dr.','Prof.'];
const LEVELS=['JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3'];
const DIVS={JSS:['Ruby','Scarlet','Emerald'],SS:['Science','Art/Commercial']};
const DC={Ruby:'ruby',Scarlet:'scarlet',Emerald:'emerald',Science:'science','Art/Commercial':'art'};
const grpOf=l=>l.startsWith('JSS')?'JSS':'SS';

/* ---------- storage ---------- */
const defaults=()=>({v:1,profile:null,subjects:[],periods:[],settings:{theme:'auto',sound:true,awake:false,saturday:false},fired:{}});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v===1){const d=defaults();return{...d,...r,settings:{...d.settings,...r.settings}}}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const ui={tab:'today',day:1,sheet:null,banner:null,ob:{name:'',title:'Mrs.',subjects:[]}};
const sat=()=>!!S.settings.saturday;                 // Saturday is an optional school day (Settings)
const dayNums=()=>sat()?[1,2,3,4,5,6]:[1,2,3,4,5];
{const d=new Date().getDay();ui.day=dayNums().includes(d)?d:1}

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
const fmt=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const secNow=d=>d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const grp=p=>p.level+' '+p.division;
const hello=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const callOf=(name,title)=>{const w=String(name).trim().split(/\s+/).filter(Boolean);return w.length?(title+' '+w[w.length-1]).trim():'Teacher'};
const callName=()=>S.profile?callOf(S.profile.name,S.profile.title):'Teacher';
const initials=()=>S.profile?S.profile.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase():'';
const todays=(d=new Date())=>S.periods.filter(p=>p.days.includes(d.getDay())&&(d.getDay()!==6||sat())).sort((a,b)=>toMin(a.start)-toMin(b.start));
const onDay=n=>S.periods.filter(p=>p.days.includes(n)&&(n!==6||sat())).sort((a,b)=>toMin(a.start)-toMin(b.start));
function status(now=new Date()){const n=secNow(now),list=todays(now);return{n,list,live:list.find(p=>n>=toMin(p.start)*60&&n<toMin(p.end)*60),next:list.find(p=>toMin(p.start)*60>n)}}
function upcomingDay(now){for(let i=1;i<=7;i++){const d=new Date(now);d.setDate(d.getDate()+i);const l=todays(d);if(l.length)return{i,d,p:l[0]}}return null}
function cdText(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h>0?h+'h '+pad(m)+'m':pad(m)+':'+pad(s)}
function weekDates(){const d=new Date(),w=d.getDay(),b=new Date(d);b.setDate(d.getDate()+(w===6&&!sat()?2:w===0?1:1-w));return dayNums().map(i=>{const x=new Date(b);x.setDate(b.getDate()+i-1);return x})}

/* ---------- icons ---------- */
const ic={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',
set:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
bellOff:'<path d="M8.7 3A6 6 0 0 1 18 8c0 3 .5 5 1.3 6.6M6.3 6.3C6.1 6.9 6 7.4 6 8c0 7-3 9-3 9h14"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M2 2l20 20"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
check:'<path d="M5 12l5 5 9-10"/>',
done:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'
};
const svg=(k,s=22,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[k]}</svg>`;
const logo=(s,fg,cut)=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="PERTRACK logo"><rect x="12" y="8" width="11" height="48" rx="5.5" fill="${fg}"/><circle cx="37" cy="26" r="13.5" fill="none" stroke="${fg}" stroke-width="9"/><path d="M37 26V20.5M37 26l4.5 3" stroke="${fg}" stroke-width="2.8" stroke-linecap="round" fill="none"/><circle cx="55" cy="9" r="6" fill="#F5A524" stroke="${cut}" stroke-width="3"/></svg>`;
const isDark=()=>document.documentElement.dataset.theme==='dark';

/* ---------- theme ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const t=S.settings.theme,d=t==='dark'||(t==='auto'&&mq.matches);document.documentElement.dataset.theme=d?'dark':'light';const m=$('meta[name=theme-color]');if(m)m.content=d?'#0B1416':'#0B3B36'}
mq.addEventListener('change',()=>{applyTheme();render()});

/* ---------- reminders ---------- */
let ac;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
addEventListener('pointerdown',unlockAudio,{once:true});
function beep(n){
if(!S.settings.sound)return;
try{unlockAudio();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.38;
o.type='sine';o.frequency.value=i%2?988:784;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.55)}}catch(e){}
}
async function notify(title,body,tag){
if(!('Notification' in window)||Notification.permission!=='granted')return;
try{const reg=await navigator.serviceWorker.getRegistration();
const o={body,tag,icon:'icon.svg',badge:'icon.svg',vibrate:[200,100,200],renotify:true};
if(reg)reg.showNotification(title,o);else new Notification(title,o)}catch(e){}
}
let bt;
function renderBanner(){
const el=$('#banner'),b=ui.banner;
if(!b){el.innerHTML='';return}
el.innerHTML=`<div class="bn ${b.k}" role="alert"><div><b>${esc(b.title)}</b><span>${esc(b.body)}</span></div><button class="ib" data-act="bn-x" aria-label="Dismiss">${svg('x',20)}</button></div>`;
clearTimeout(bt);if(b.k==='pre')bt=setTimeout(()=>{ui.banner=null;renderBanner()},15000);
}
function fire(p,k,force){
const title=k==='pre'?`${p.subject} starts in 5 minutes`:`Time for ${p.subject}`;
const body=`${grp(p)}${p.room?' · '+p.room:''} · ${p.start} – ${p.end}`;
ui.banner={k,title,body};renderBanner();
beep(k==='at'?3:1);
if(navigator.vibrate)try{navigator.vibrate(k==='at'?[300,120,300,120,300]:[200,100,200])}catch(e){}
if(force||document.visibilityState!=='visible')notify(title,body,p.id+k);
}

const n=new Date(),s=n.getHours()*60+n.getMinutes()+5;
fire({id:'test',subject:S.subjects[0]||'Mathematics',level:'SS 1',division:'Science',room:'Room 4',start:fmt(s),end:fmt(s+40)},'pre',true);
}
async function askNotif(){

function markPast(p){
const now=new Date(),n=secNow(now),day=iso(now);
if(!p.days.includes(now.getDay()))return;
const st=toMin(p.start)*60;
if(n>=st-300)S.fired[p.id+'|'+day+'|pre']=1;
if(n>=st)S.fired[p.id+'|'+day+'|at']=1;
}
let lastSig='';
function sig(now){const s=status(now),p=s.live||s.next,n=s.n;return[p&&p.id,!!s.live,p&&n>=toMin(p.start)*60-300,p&&n>=toMin(p.start)*60,s.list.map(x=>n>=toMin(x.end)*60?1:0).join(''),now.getDate()].join('|')}
function tick(){
if(!S.profile)return;
const now=new Date(),n=secNow(now),day=iso(now);
todays(now).forEach(p=>{
const st=toMin(p.start)*60;
[['pre',st-300,p.pre],['at',st,p.at]].forEach(([k,t,on])=>{
if(!on)return;
const key=p.id+'|'+day+'|'+k;
if(S.fired[key])return;
const late=n-t;
if(late>=0&&late<120){S.fired[key]=1;save();fire(p,k)}
});
});
if(ui.tab==='today'&&!ui.sheet){const s=sig(now);if(s!==lastSig)render();else{const h=$('#hero');if(h)h.innerHTML=heroInner()}}
}
let wl=null;

if(S.settings.awake&&'wakeLock' in navigator&&document.visibilityState==='visible'){if(!wl)wl=await navigator.wakeLock.request('screen')}

}catch(e){wl=null}
}

const chip=(on,tM,label)=>{const sent=n>=tM*60;return`<div class="rc"><b>${on&&sent?svg('check',16,2.5):svg('bell',16,2.2)}${label}</b><span>${on?(sent?'Sent at ':'Rings at ')+fmt(tM):'Off'}</span></div>`};

function prow(p,st,isToday){
const n=st.n,done=isToday&&n>=toMin(p.end)*60,live=isToday&&st.live&&st.live.id===p.id,next=isToday&&!st.live&&st.next&&st.next.id===p.id||isToday&&st.live&&st.next&&st.next.id===p.id;

:`${live?'<span class="tag">Now</span>':next?'<span class="tag">Next</span>':''}<button type="button" class="ib bellb ${on?'':'off'}" data-act="bell" data-id="${p.id}" aria-label="${on?'Reminders on':'Reminders off'} for ${esc(p.subject)}">${svg(on?'bell':'bellOff',20)}</button>`;

function saveP(){
const d=ui.sheet;
if(!d.subject)d.err='Pick a subject (add some in Settings).';
else if(!d.days.length)d.err='Choose at least one day.';
else if(!/^\d\d:\d\d$/.test(d.start)||!/^\d\d:\d\d$/.test(d.end))d.err='Set a start and end time.';
else if(toMin(d.end)<=toMin(d.start))d.err='End time must be after the start time.';
else d.err='';
if(d.err){renderSheet();return}
const p={id:d.id||uid(),subject:d.subject,level:d.level,division:d.division,days:d.days.slice().sort(),start:d.start,end:d.end,room:d.room.trim(),pre:!!d.pre,at:!!d.at};
const i=S.periods.findIndex(x=>x.id===p.id);
if(i>=0)S.periods[i]=p;else S.periods.push(p);
Object.keys(S.fired).forEach(k=>{if(k.startsWith(p.id+'|'))delete S.fired[k]});
markPast(p);save();ui.sheet=null;renderSheet();render();
}

/* ---------- events ---------- */
function act(a,b){
const id=b.dataset.id,v=b.dataset.v;
switch(a){
case'tab':ui.tab=b.dataset.t;render();scrollTo(0,0);break;
case'day':ui.day=+b.dataset.d;render();break;
case'add':openSheet();break;
case'edit':{const p=S.periods.find(x=>x.id===id);if(p)openSheet(p);break}
case'bell':{const p=S.periods.find(x=>x.id===id);if(p){const on=!(p.pre||p.at);p.pre=p.at=on;if(on)markPast(p);save();render()}break}
case'closeSheet':ui.sheet=null;renderSheet();break;
case'f-subject':ui.sheet.subject=v;renderSheet();break;
case'f-level':{ui.sheet.level=v;const g=DIVS[grpOf(v)];if(!g.includes(ui.sheet.division))ui.sheet.division=g[0];renderSheet();break}
case'f-div':ui.sheet.division=v;renderSheet();break;
case'f-day':{const n=+b.dataset.d,a2=ui.sheet.days;ui.sheet.days=a2.includes(n)?a2.filter(x=>x!==n):a2.concat(n).sort();renderSheet();break}
case'f-tog':ui.sheet[b.dataset.k]=!ui.sheet[b.dataset.k];renderSheet();break;
case'saveP':saveP();break;
case'delP':if(confirm('Delete this period?')){S.periods=S.periods.filter(x=>x.id!==ui.sheet.id);save();ui.sheet=null;renderSheet();render()}break;
case'ob-title':ui.ob.title=v;$('#ob-titles').innerHTML=titleChips(v,'ob-title');updOb();break;
case'ob-add':if(addSub(ui.ob.subjects,'#ob-sub')){$('#ob-subs').innerHTML=subChips(ui.ob.subjects,'ob-rm');updOb()}$('#ob-sub').focus();break;
case'ob-rm':ui.ob.subjects.splice(+b.dataset.i,1);$('#ob-subs').innerHTML=subChips(ui.ob.subjects,'ob-rm');updOb();break;
case'ob-go':if(!okOb())break;S.profile={name:ui.ob.name.trim(),title:ui.ob.title};S.subjects=ui.ob.subjects.slice();save();ui.tab='today';render();askNotif();break;
case'subj-add':if(addSub(S.subjects,'#set-sub')){save();render();const i=$('#set-sub');if(i)i.focus()}break;
case'subj-rm':S.subjects.splice(+b.dataset.i,1);save();render();break;
case'ptitle':S.profile.title=v;save();render();break;
case'theme':S.settings.theme=v;save();render();break;
case'sound':S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound)beep(1);break;
case'saturday':S.settings.saturday=!S.settings.saturday;save();render();break;
case'awake':S.settings.awake=!S.settings.awake;save();applyAwake();render();break;
case'enableNotif':askNotif();break;
case'testAlert':testAlert();break;
case'reset':if(confirm('Delete your profile, subjects and timetable from this device?')){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();ui.tab='today';ui.ob={name:'',title:'Mrs.',subjects:[]};ui.sheet=null;renderSheet();render()}break;
case'bn-x':ui.banner=null;renderBanner();break;
}
}

});
document.addEventListener('keydown',e=>{
if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();act(e.target.dataset.enter,e.target)}
if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderSheet()}
});

/* ---------- boot ---------- */
(function prune(){const t=iso(new Date());Object.keys(S.fired).forEach(k=>{if(k.split('|')[1]!==t)delete S.fired[k]});save()})();
render();
applyAwake();
setInterval(tick,1000);
tick();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
